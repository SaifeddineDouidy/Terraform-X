name: Terraform CI/CD

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  AWS_REGION: us-east-1

jobs:
  terraform:
    name: 'Terraform Validation & Planning'
    runs-on: ubuntu-latest

    steps:
      - name: 🧾 Checkout Code
        uses: actions/checkout@v4

      - name: 📦 Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.1

      - name: 🔍 Terraform Format Check
        id: fmt
        run: terraform fmt -check
        working-directory: live/my-project

      - name: 🛠️ Terraform Init
        id: init
        run: terraform init
        working-directory: live/my-project

      - name: ✅ Terraform Validate
        id: validate
        run: terraform validate -no-color
        working-directory: live/my-project

      - name: 🔁 Iterate Environments and Plan
        run: |
          ENVS=("develop" "uat" "preprod" "prod")
          for ENV in "${ENVS[@]}"; do
            echo "📁 Environment: $ENV"
            terraform -chdir=live/my-project plan -var-file=env/$ENV.tfvars -out=$ENV.tfplan
            echo "✅ Plan generated for $ENV"
          done

      - name: 💰 Infracost - Cost Estimate (optional)
        if: always()
        uses: infracost/actions@v3
        with:
          path: live/my-project
          api-key: ${{ secrets.INFRACOST_API_KEY }}
        env:
          TERRAFORM_PLAN_FLAGS: --var-file=env/develop.tfvars
