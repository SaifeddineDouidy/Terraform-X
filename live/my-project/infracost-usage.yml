version: 0.1
resource_usage:

  # ========================================
  # RDS Database Instances
  # ========================================
  
  module.keycloak.aws_db_instance.keycloak_rds:
    # (Infracost does not support backup_storage_gb here—remove or move these overrides)
    # no overrides for this resource

  module.rds.aws_db_instance.this:
    # no overrides for this resource

  # ========================================
  # ECS Services - Dev Team Usage
  # ========================================
  
  module.keycloak.aws_ecs_service.keycloak_service:
    vcpu: 1
    memory_gb: 2

  module.ecs.aws_ecs_service.this["agenticx"]:
    vcpu: 0.25
    memory_gb: 0.5

  module.ecs.aws_ecs_service.this["backoffice"]:
    vcpu: 0.25
    memory_gb: 0.5

  module.ecs.aws_ecs_service.this["consul"]:
    vcpu: 0.25
    memory_gb: 0.5

  module.ecs.aws_ecs_service.this["nextjs"]:
    vcpu: 0.25
    memory_gb: 0.5

  module.ecs.aws_ecs_service.this["spring-gateway"]:
    vcpu: 0.25
    memory_gb: 0.5

  # ========================================
  # NAT Gateway - Reduced Data Processing
  # ========================================
  
  module.network.aws_nat_gateway.this[0]:
    # monthly_data_processed_gb is supported
    monthly_data_processed_gb: 20

  # ========================================
  # WAF - Dev Traffic Patterns
  # ========================================
  
  module.waf.aws_wafv2_web_acl.this:
    # monthly_requests is supported
    monthly_requests: 100000

  # ========================================
  # Secrets Manager - Dev Usage
  # ========================================
  
  aws_secretsmanager_secret.keycloak_db_password:
    monthly_requests: 1000

  aws_secretsmanager_secret.rds_password:
    monthly_requests: 500

  # ========================================
  # (You can add other supported usage overrides here, but remove all of the unsupported ones)
