    monthly_data_processed_gb: 50

resource_type_default_usage:
  aws_alb:
    new_connections: 500 # Number of newly established connections per second - dev environment
    active_connections: 500 # Number of active connections per minute - dev environment
    processed_bytes_gb: 50 # Data processed by load balancer - smaller dev workload
    rule_evaluations: 500 # Product of rules and request rate - dev environment
  aws_cloudwatch_log_group:
    storage_gb: 20 # Log storage - dev applications
    monthly_data_ingested_gb: 5 # Monthly log ingestion - dev volume
    monthly_data_scanned_gb: 50 # Log insights scanning - dev debugging
  aws_db_instance:
